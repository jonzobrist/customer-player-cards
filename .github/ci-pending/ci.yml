name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly link check catches rotted external links

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: lychee-v0.24.2
    steps:
      - uses: actions/checkout@v4
      - name: Install lychee
        run: |
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo install lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          lychee --version
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lychee --config lychee.toml --no-progress .

  mockups:
    name: Mockups (build, typecheck, HTML validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mockups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mockups/package-lock.json
      - run: npm ci
      - name: Typecheck mockup source
        run: npm run typecheck
      - name: Rebuild and check index.html is up to date
        run: |
          npm run build
          git diff --exit-code -- index.html || (echo "::error::mockups/index.html is stale. Run 'npm run build' in mockups/ and commit it." && exit 1)
      - name: Validate HTML
        run: npx --yes html-validate@9 --config ../.htmlvalidate.json index.html template.html

