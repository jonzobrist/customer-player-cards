# Link checker config (lychee v0.24): https://lychee.cli.rs
exclude_path = ["node_modules", "mockups/index\\.html", "mockups/template\\.html"]
include_fragments = "full"
accept = ["200..=299", "429"]
max_retries = 3
timeout = 20
exclude = [
  '^https?://([a-z0-9-]+\.)?example\.com',
  '^https://github\.com/jonzobrist/customer-player-cards/(issues/new|security/advisories/new|compare/|actions)',
]
